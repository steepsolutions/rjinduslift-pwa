<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F5821F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="R&J">
<title>R&J Induslift — Mantenimiento</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { 
    width: 100%; height: 100%; 
    background: linear-gradient(160deg, #1A1A1A 0%, #2B2B2B 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff; overflow: hidden;
  }
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 30px 24px;
    text-align: center;
  }
  .logo-box {
    width: 110px; height: 110px; border-radius: 24px;
    background: #F5821F;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 900; color: #fff; letter-spacing: -2px;
    box-shadow: 0 10px 32px rgba(245,130,31,.45);
    margin-bottom: 24px;
    animation: pop .5s ease;
  }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  .titulo {
    font-size: 26px; font-weight: 800;
    letter-spacing: -0.5px; margin-bottom: 6px;
  }
  .subtitulo {
    font-size: 13px; color: #9fb0c9;
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 40px;
  }
  .btn-abrir {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 18px 44px;
    background: #F5821F; color: #fff;
    border: none; border-radius: 14px;
    font-size: 17px; font-weight: 800;
    letter-spacing: .4px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(245,130,31,.4);
    transition: transform .15s ease, box-shadow .15s ease;
    text-decoration: none;
  }
  .btn-abrir:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(245,130,31,.55);
  }
  .btn-abrir:active {
    transform: translateY(0);
  }
  .btn-abrir .icono {
    font-size: 20px;
  }
  .pie {
    position: absolute; bottom: 30px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; color: #666; letter-spacing: 1px;
  }
  .pie b { color: #F5821F; }
  
  .cargando {
    margin-top: 20px;
    font-size: 13px; color: #9fb0c9;
    display: none;
  }
  .cargando.visible { display: block; }
</style>
</head>
<body>

<div class="screen">
  <div class="logo-box">R&J</div>
  <div class="titulo">R&J Induslift</div>
  <div class="subtitulo">Mantenimiento</div>
  
  <button class="btn-abrir" id="btnAbrir" onclick="abrirApp()">
    <span class="icono">📱</span>
    <span>Abrir Aplicación</span>
  </button>
  
  <div class="cargando" id="cargando">Abriendo aplicación...</div>
  
  <div class="pie">Desarrollado por <b>Steep Solutions</b></div>
</div>

<script>
// URL de la Web App de Google Apps Script
var URL_APP = 'https://script.google.com/macros/s/AKfycbyp1B6WwOd6d2-Od_2KMZXsYR3NzbZEhy4y-7kQKl95GYn3y2PNylxp5TxXre4utMmizg/exec';

function abrirApp() {
  document.getElementById('btnAbrir').style.display = 'none';
  document.getElementById('cargando').classList.add('visible');
  
  // Abrir la app en la misma ventana (más rápido)
  window.location.href = URL_APP;
}

// Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').then(function(reg) {
      console.log('Service Worker OK:', reg.scope);
    }).catch(function(err) {
      console.warn('Service Worker error:', err);
    });
  });
}

// Detección online/offline
window.addEventListener('offline', function() {
  alert('Sin conexión a internet. Conéctate para usar la aplicación.');
});
</script>

</body>
</html>
